<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Parcelas de Manurga</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<div class="app-container">
    <div class="professional-header">
        <div class="header-accent"></div>
        <div class="header-content">
            <div class="header-row-1">
                <div class="title-section"><h1>Parcelas <span>· Manurga</span></h1></div>
                <div class="owner-name">José Ángel López de Letona Ortiz de Lejarazu</div>
            </div>
            <div class="header-row-2">
                <div class="subtitle">Visor cartográfico · Comentarios, fotos y vídeos</div>
                <div style="display: flex; gap: 5px; align-items: center;">
                    <button id="btnUsuario" class="btn-exportar">👤 <span id="nombreActual">Identificarse</span></button>
                    <button id="btnVerTodas" class="btn-exportar">🗺️ Ver todas</button>
                    <button id="btnSeguir" class="btn-exportar">📍 Seguirme</button>
                    <button id="btnMedir" class="btn-exportar">📏 Medir distancia</button>
                    <button id="btnBrujula" class="btn-exportar">🧭 Brújula</button>
                    <div class="dropdown-menu">
                        <button class="dropdown-button" id="dropdownButton">📋 Parcelas <span class="dropdown-arrow">▼</span></button>
                        <div class="dropdown-list" id="dropdownList">
                            <div class="dropdown-header">Propietario</div>
                            <div class="dropdown-filtros" id="dropdownFiltros">
                                <button class="filtro-propietario activo" data-propietario="José Ángel">José Ángel</button>
                                <button class="filtro-propietario" data-propietario="Juli">Juli</button>
                                <button class="filtro-propietario" data-propietario="Félix">Félix</button>
                                <button class="filtro-propietario" data-propietario="Todas">Todas</button>
                            </div>
                            <div class="dropdown-header">Selecciona una parcela</div>
                            <div class="dropdown-items" id="dropdownItems"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="map"></div>
    <div id="avisoPoligonos" class="aviso-poligonos"></div>
</div>

<div id="lightbox" class="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <div class="lightbox-content" id="lightboxContent"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
